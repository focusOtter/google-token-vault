.66, 22.66 3.2, 32.13 -0.04 M17.06 5.34 C20.87 3.8, 25.06 2.53, 32.13 -0.04" stroke="#355445" stroke-width="1.5" fill="none"></path></g><g transform="translate(24.9917362702243 614) rotate(0 16 0)"><path d="M17.13 -5.61 C20.18 -4.09, 22.67 -3.36, 32.13 -0.04 M17.13 -5.61 C20.94 -4.25, 25.12 -2.63, 32.13 -0.04" stroke="#355445" stroke-width="1.5" fill="none"></path></g></g><mask></mask><g stroke-linecap="round"><g transform="translate(24.9917362702243 744) rotate(0 16 0)"><path d="M0.2 -0.14 C5.6 -0.1, 26.81 -0.07, 32.08 -0.02 M-0.08 -0.48 C5.31 -0.37, 26.6 0.36, 31.88 0.37" stroke="#355445" stroke-width="1.5" fill="none"></path></g><g transform="translate(24.9917362702243 744) rotate(0 16 0)"><path d="M16.74 5.54 C19.57 4.6, 22.77 3.23, 31.88 0.37 M16.74 5.54 C21.94 3.71, 26.67 1.93, 31.88 0.37" stroke="#355445" stroke-width="1.5" fill="none"></path></g><g transform="translate(24.9917362702243 744) rotate(0 16 0)"><path d="M16.96 -5.41 C19.72 -4.15, 22.88 -3.34, 31.88 0.37 M16.96 -5.41 C22.11 -3.56, 26.76 -1.66, 31.88 0.37" stroke="#355445" stroke-width="1.5" fill="none"></path></g></g><mask></mask><title id="architecture-title">Orbit architecture</title><desc id="architecture-description">The browser connects to the Next.js server. The server calls AI Gateway for the model, Auth0 Token Vault for Google tokens, Google APIs to read Calendar and create Gmail drafts, and Neon Postgres for private chat history.</desc><g transform="translate(-11 4)"><text x="220" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#253e32">Browser</text><text x="220" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#253e32">Chat + Google consent</text><text x="220" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#253e32">Next.js server</text><text x="220" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#253e32">Auth0 session + tools</text><text x="220" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#253e32">AI Gateway</text><text x="220" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#253e32">Model + streaming</text><text x="220" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#253e32">Auth0 Token Vault</text><text x="220" y="502" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#253e32">Scoped Google tokens</text><text x="220" y="592" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#253e32">Google APIs</text><text x="220" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#253e32">Calendar read</text><text x="220" y="644" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#253e32">Gmail drafts only</text><text x="220" y="730" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#253e32">Neon Postgres</text><text x="220" y="762" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#253e32">Private chat history</text></g></svg>
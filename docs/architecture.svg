t-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#253e32">Google APIs</text><text x="154" y="464" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#253e32">Calendar read</text><text x="154" y="492" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#253e32">Gmail drafts</text><text x="466" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#253e32">Neon Postgres</text><text x="466" y="476" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#253e32">Chat history</text></g></svg>